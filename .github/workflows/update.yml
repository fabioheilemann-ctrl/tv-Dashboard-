name: Daten aktualisieren

on:
  schedule:
    - cron: "7,37 * * * *"   # alle 30 Minuten
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNELS: ${{ vars.YT_CHANNELS }}
        run: python scripts/update.py
      - name: Speichern
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json history.json
          git diff --cached --quiet && exit 0
          git commit -m "Daten $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git pull --rebase --autostash
          git push
