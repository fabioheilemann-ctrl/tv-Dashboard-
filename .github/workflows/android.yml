name: TV-App bauen

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: App bauen
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: App auf der Website ablegen
        run: |
          mkdir -p app
          cp android/app/build/outputs/apk/release/app-release.apk app/kommandozentrale.apk
          echo "{\"version\": ${{ github.run_number }}, \"built\": \"$(date -u +%FT%TZ)\"}" > app/version.json
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add app/
          git commit -m "TV-App Version ${{ github.run_number }}"
          git pull --rebase --autostash
          git push
